[project]
name = "weekend-coordinator"
version = "0.1.0"
description = "Supervisor + parallel fan-out multi-agent day-trip planner built on the Claude Agent SDK"
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.172",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
